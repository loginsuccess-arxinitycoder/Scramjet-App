<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Mathly</title>
		<link rel="shortcut icon" href="favicon.ico" />

		<!-- Scramjet core: keep these, and keep them in this order -->
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>

		<!-- Home page: edit home-config.js to change what shows up -->
		<link rel="stylesheet" href="home.css" />
		<script src="home-config.js"></script>
		<script src="home.js" defer></script>
	</head>

	<body class="mh">
		<main id="home">
			<header class="mh-top">
				<h1 id="mh-title">Mathly</h1>
				<p id="mh-tag"></p>
			</header>

			<!-- Scramjet needs these three ids (sj-form, sj-address, sj-search-engine) -->
			<form id="sj-form">
				<input
					id="sj-search-engine"
					value="https://www.google.com/search?q=%s"
					type="hidden"
				/>
				<input id="sj-address" type="text" placeholder="Search the web freely" />
			</form>
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>

			<!-- Filled in by home.js from home-config.js -->
			<div id="mh-sections"></div>

			<footer class="mh-foot">
				<a href="credits.html">Credits</a> &middot; Powered by Scramjet
			</footer>
		</main>

		<script src="/_mathly/return.js"></script>

</html>
